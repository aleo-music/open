<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Open</title>
<style>
  body{font:17px -apple-system,system-ui,sans-serif;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f2f2f7}
  a{display:block;margin:10px auto;padding:16px 26px;border-radius:14px;background:#34c759;color:#fff;text-decoration:none;font-weight:600;font-size:19px;text-align:center}
  a.alt{background:#fff;color:#007aff;font-weight:500;font-size:16px}
  p{color:#8e8e93;text-align:center;font-size:14px}
</style>
</head>
<body>
<div id="box"><p id="msg"></p></div>
<script>
  // Everything lives in the #fragment, which browsers never send to the server.
  //   #<phone or email>                     -> iMessage (sms:)
  //   #gm/<gmail thread id hex>/<message-id> -> Gmail app (thread), with fallbacks
  var raw = decodeURIComponent((location.hash || "").slice(1)).trim();
  var box = document.getElementById("box");
  function btn(label, url, alt) {
    var a = document.createElement("a"); a.textContent = label; a.href = url; if (alt) a.className = "alt";
    box.insertBefore(a, document.getElementById("msg")); return a;
  }
  function fail(t) { document.getElementById("msg").textContent = t; }

  if (raw.indexOf("gm/") === 0) {
    // #gm/<thread hex>/<message-id>[|<search text>]   (search text optional, e.g. the subject)
    document.title = "Open in Gmail";
    var bar = raw.indexOf("|");
    var q = bar >= 0 ? raw.slice(bar + 1).trim() : "";
    var parts = (bar >= 0 ? raw.slice(3, bar) : raw.slice(3)).split("/");
    var thr = parts[0] || "", mid = parts.slice(1).join("/");
    var thrOk = /^[0-9a-f]{8,20}$/.test(thr);
    var midOk = /^[^\s<>"]{3,250}$/.test(mid);
    if (!thrOk && !midOk && !q) { fail("No valid email in this link."); }
    else {
      var e = encodeURIComponent;
      var subj = q ? 'subject:"' + q.replace(/"/g, "") + '"' : "";
      var idq = midOk ? "rfc822msgid:" + mid : "";
      // Test mode: which Gmail-app search link does this phone understand? (no auto-redirect)
      if (subj) btn("A · app search (subject)", "googlegmail:///search?q=" + e(subj));
      if (idq) btn("B · app search (message id)", "googlegmail:///search?q=" + e(idq));
      if (subj) btn("C · app search, other form", "googlegmail://search?q=" + e(subj));
      if (subj) btn("D · app search, path form", "googlegmail:///search/" + e(subj));
      btn("Gmail app (inbox)", "googlegmail://", true);
      if (midOk) btn("Open in Safari", "https://mail.google.com/mail/u/0/#search/" + e(idq), true);
      fail("Tap A, then come back and try B, C, D. Tell me which one lands on the email.");
    }
  } else {
    var ok = /^\+?[0-9]{6,15}$/.test(raw) || /^[^\s@<>"\/]+@[^\s@<>"\/]+\.[^\s@<>"\/]+$/.test(raw);
    if (ok) {
      document.title = "Open in Messages";
      var url = "sms:" + raw;
      btn("Open in Messages", url);
      location.replace(url);
    } else { fail("No valid contact in this link."); }
  }
</script>
</body>
</html>
